# =============================================================================
# legacy_mypose.yaml —— 历史对照配置（见 VERIFICATION.md §8）：一份配置复现
# 历史 MyPose 管线的**设计选择**（不复现其数值）。
#
# 基于 default.yaml 覆盖（src/config.py 的 base 继承），只声明差异项。
# 各覆盖项与历史实现的逐项对应、以及 9 条已知非复现差异（Proj 定义、内点
# 门槛位置、边界过滤、采样密度、打分函数、模板来源与单位、半像素约定、
# 历史实现缺陷等），见 VERIFICATION.md §8.6——数字不可比时先查那张表。
#
# ⚠ topk_best 里除 top1 外全部是 **GT 择优 oracle 上界**（用测试集真值挑
# 候选），只能做"模板检索若完美时的性能潜力"分析，不得与端到端方法同表
# 比较（见 VERIFICATION.md §8 开头的 oracle 警告）。
# =============================================================================
base: default.yaml

detection:
  # 历史管线的实际数据流：裁剪全程用 GT coseg mask 求外接框，YOLO bbox
  # 从未参与任何计算（考证见 VERIFICATION.md §8.2/§8.6）。故此处用 gt_mask
  # 忠实复现；YoloBboxLocalizer 保留为独立消融项（segmenter: yolo）——
  # 在本配置里启用它只会引入死值输出 + ultralytics 硬依赖 + 漏检丢帧。
  segmenter: gt_mask
  crop_mode: tight_square      # mask 涂黑 + 1.1 倍方形裁剪 + resize 512
  crop_size: 512
  crop_expand: 1.1

templates:
  template_source: depth_map   # 模板库额外渲染深度图（需重新 onboard）

matching:
  template_prescreen: none     # 全模板逐一 MASt3R 匹配（无 DINOv2 预筛）
  template_ranking: mast3r     # 全解码后按 sim(m) 排序（历史行为）
  top_k: 40                    # 保留全部 40 个候选
  lifting: depth_backproject   # 深度图反投影 2D-3D 提升
  depth_max: null              # 本库深度单位=物体系单位（mm 级），历史口径的
                               # 5.0 米上限不适用；深度无效值(<=0)照常剔除
  sim_threshold: -1.0          # 历史口径不做相似度阈值过滤
  cycle_tau_px: 0.0            # τ=0 即严格互最近邻（fast_reciprocal_NNs 语义）

solver:
  pnp_flag: sqpnp              # 历史口径 SOLVEPNP_SQPNP
  ransac_reproj_px: 2.0        # 历史口径 reprojectionError=2.0
  ransac_iterations: 400       # 历史口径 iterationsCount=400
  refine_lm: false             # 历史管线无 LM 精化步骤
  # 候选顺序必须按模板相似度降序：历史 top-K 窗口就是"MASt3R 相似度
  # 排名前 K"，topk_best 的 top1/top3/top5 是在这个顺序上取窗口。
  # 若沿用默认的 inlier，"top1" 会变成"内点最优候选"= 本库端到端预测
  # 本身，与历史"检索排名第一"完全不是同一指标（见 VERIFICATION.md §8.4）。
  selection: similarity

metrics:
  # topK best 档位。⚠ 除 top1 外全部是 **GT 择优 oracle 上界**，只能做
  # "模板检索若完美时的性能潜力"分析，不得与端到端方法同表比较。
  topk_best: [1, 3, 5, 40]
  # 双向 Chamfer ADD-S（非标准，仅为对照历史 eggbox/glue 数字；
  # 与文献比较时必须换回 unidirectional）
  adds_definition: bidirectional_legacy
